name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release with the card file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            && gh release upload "${GITHUB_REF_NAME}" fv-hud-card.js --clobber \
            || gh release create "${GITHUB_REF_NAME}" fv-hud-card.js --title "${GITHUB_REF_NAME}" --generate-notes
